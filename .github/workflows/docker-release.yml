name: Publish Release Image to Docker Hub

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download Eclipse Temurin JDK 25
        run: |
          DOWNLOAD_URL=$(curl -s "https://api.adoptium.net/v3/assets/feature_releases/25/ga?architecture=x64&heap_size=normal&image_type=jdk&jvm_impl=hotspot&os=linux" | jq -r '.[0].binaries[0].package.link')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find a suitable JDK 25 binary download URL."
            exit 1
          fi
          echo "Download URL: $DOWNLOAD_URL"
          wget -O openjdk25.tar.gz "$DOWNLOAD_URL"
          tar -xzf openjdk25.tar.gz
          JAVA_DIR=$(tar -tf openjdk25.tar.gz | head -1 | cut -f1 -d"/")
          echo "JAVA_HOME=$PWD/$JAVA_DIR" >> $GITHUB_ENV
          echo "$PWD/$JAVA_DIR/bin" >> $GITHUB_PATH

      - name: Maven Version Check
        run: mvn -v

      - name: Maven Clean and Package
        run: mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Release Tag
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t benferenchak/ramsey-queue-manager:${{ env.TAG_NAME }} \
            -t benferenchak/ramsey-queue-manager:latest \
            --push .
