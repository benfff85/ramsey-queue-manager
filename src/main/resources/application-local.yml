ramsey:
  mw:
    host: "http://localhost:36000"
  graph:
    url: ${ramsey.mw.host}/api/ramsey/graphs
  work-unit:
    queue:
      depth:
        min: 2500
        max: 5000
        publish-batch-size: 1000
      url: ${ramsey.mw.host}/api/ramsey/work-units
      analysis-type: TARGETED
      frequency-in-millis: 30000
  campaign:
    url: ${ramsey.mw.host}/api/ramsey/campaigns
  stage:
    url: ${ramsey.mw.host}/api/ramsey/stages
  stage-progression:
    frequency-in-millis: 30000

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}